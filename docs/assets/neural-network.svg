<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">A neural network with input, hidden, and output layers</title>
  <desc id="desc">Three input circles connect to four hidden neurons, which connect to two output neurons.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
  <rect width="960" height="390" rx="22" fill="#f8fafc"/>
  <g stroke="#94a3b8" stroke-width="2" opacity=".72">
    <path d="M170 105L410 75M170 105L410 155M170 105L410 235M170 105L410 315M170 195L410 75M170 195L410 155M170 195L410 235M170 195L410 315M170 285L410 75M170 285L410 155M170 285L410 235M170 285L410 315"/>
    <path d="M470 75L735 145M470 75L735 245M470 155L735 145M470 155L735 245M470 235L735 145M470 235L735 245M470 315L735 145M470 315L735 245"/>
  </g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><circle cx="150" cy="105" r="27"/><circle cx="150" cy="195" r="27"/><circle cx="150" cy="285" r="27"/></g>
  <g fill="#ede9fe" stroke="#7c3aed" stroke-width="3"><circle cx="440" cy="75" r="27"/><circle cx="440" cy="155" r="27"/><circle cx="440" cy="235" r="27"/><circle cx="440" cy="315" r="27"/></g>
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="3"><circle cx="765" cy="145" r="30"/><circle cx="765" cy="245" r="30"/></g>
  <g font-family="Arial,sans-serif" fill="#0f172a" text-anchor="middle"><text x="150" y="113" font-size="20">x₁</text><text x="150" y="203" font-size="20">x₂</text><text x="150" y="293" font-size="20">x₃</text><text x="765" y="153" font-size="18">ŷ₁</text><text x="765" y="253" font-size="18">ŷ₂</text>
  <text x="150" y="365" font-size="17" font-weight="bold">INPUTS</text><text x="440" y="365" font-size="17" font-weight="bold">HIDDEN LAYER</text><text x="765" y="315" font-size="17" font-weight="bold">OUTPUTS</text></g>
  <text x="480" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#334155">Each connection carries a learned weight</text>
</svg>
